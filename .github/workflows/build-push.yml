name: Build & Push Images

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/nba-scout-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/nba-scout-frontend

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            image_env: BACKEND_IMAGE
          - service: frontend
            context: ./frontend
            image_env: FRONTEND_IMAGE

    steps:
      - uses: actions/checkout@v7

      # QEMU é o que permite montar a variante arm64 num runner amd64.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env[matrix.image_env] }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Multi-arch: o host de deploy é ARM (Oracle Ampere A1 do free tier), então
          # a imagem precisa da variante arm64 — sem ela o `docker compose pull` no
          # host falha com "no matching manifest for linux/arm64/v8".
          # amd64 continua publicado para dev local e para hosts x86.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope por serviço E por workflow. Duas razões:
          #  - sem scope, backend e frontend dividiam a MESMA entrada de cache do GHA
          #    e se sobrescreviam a cada push;
          #  - com o mesmo scope do ci.yml, o job docker-build (que é amd64-only)
          #    sobrescreveria o índice multi-arch escrito aqui, deixando a build arm64
          #    fria de novo — os dois workflows rodam em push para main.
          cache-from: type=gha,scope=${{ matrix.service }}-release
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-release
